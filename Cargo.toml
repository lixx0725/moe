[package]
name = "moe"
version = "0.0.4"
default-run = "moe"
edition = "2024"
rust-version = "1.100"
description = "A native terminal emulator for Windows, Linux, and macOS."
license = "0BSD"
publish = false

[[bin]]
name = "moe-cli"
path = "src/launcher/main.rs"

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading"] }
