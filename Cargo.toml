[package]
name = "moe"
version = "0.0.2"
edition = "2024"
rust-version = "1.100"
description = "A native terminal emulator for Windows, Linux, and macOS."
license = "0BSD"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26.0", default-features = false }
dirs = "7.0.0"
futures = "0.3.34"
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
